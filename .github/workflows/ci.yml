name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token, no repository secrets referenced anywhere in this workflow.
permissions:
  contents: read

jobs:
  # The disposable verifier: a GitHub-hosted VM with a throwaway Postgres and fake
  # credentials. scripts/verify.mjs (the same entry point used locally) supervises:
  # it runs every repository check as a separate unprivileged user with loopback-only
  # egress, proves that boundary with an adversarial probe first, and uploads the
  # evidence from a directory that user cannot touch. See docs/verification.md.
  hiring-desk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons/hiring-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addons/hiring-desk/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: npm ci
      - run: npm run build
      - run: npm test

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # Verify the exact PR head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # No npm cache: the sandbox user fetches dependencies through the supervisor's
      # registry-only proxy with lifecycle scripts disabled.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: verify (dependencies, build, unit, migrations, integration)
        run: node scripts/verify.mjs run --out "$RUNNER_TEMP/verification"
      - name: upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: ${{ runner.temp }}/verification
          retention-days: 14
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest harness tools addons

  vault:
    # The fixture-vault test of the 15-minute path: init a brand-new vault from
    # the template and assert it is complete and self-consistent (AGENTS.md
    # generated, the starter org present and valid, the guard wired). No
    # Postgres, no build: this is the part a stranger hits first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: init a vault from the template and check it
        run: |
          set -eux
          rm -rf "$RUNNER_TEMP/vault" && mkdir -p "$RUNNER_TEMP/vault"
          ln -s "$PWD" "$RUNNER_TEMP/vault/.secondbrain"
          cd "$RUNNER_TEMP/vault"
          python3 .secondbrain/tools/sbvault.py init .
          head -1 AGENTS.md | grep -q 'generated by secondbrain-vault rules'
          python3 -c "import json, pathlib; o=json.loads(pathlib.Path('.agents/org.json').read_text()); assert o['ceo']=='owner' and {'owner','atlas','bolt','sage'} == set(o['agents'])"
          test -f .claude/settings.json
          grep -q 'guard.py' .claude/settings.json
          python3 .secondbrain/tools/sbvault.py rules --check

  zen-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zen-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zen-agent/package-lock.json
      - run: npm ci
      - run: npm test

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-public.sh
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --log-opts=--all --redact --no-banner
